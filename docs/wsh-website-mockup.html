<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSH Website Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff9f2; --paper:#fff; --sand:#f8f0e5; --line:#efe5d8; --line-2:#e4d6c4;
  --ink:#33415c; --ink-2:#5d6882; --ink-3:#8b93a7;
  --teal:#7fb8ac; --teal-50:#eef6f4; --teal-100:#dcefe9; --teal-700:#3d7d71;
  --mustard:#f4c87a; --mustard-50:#fdf4e2; --mustard-700:#8f6310;
  --blush:#f6d7ce; --blush-50:#fcefeb; --rose-700:#a84a38;
  --tiger:#efa25e; --sky-50:#ecf3f8; --sky-700:#3c6a8a;
  --r:18px; --shadow:0 1px 2px rgba(51,65,92,.05),0 10px 30px -14px rgba(51,65,92,.16);
}
*{box-sizing:border-box;margin:0}
body{background:var(--cream);color:var(--ink);font:600 14px/1.5 Quicksand,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Fredoka,Quicksand,sans-serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.2} h2{font-size:18px} h3{font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12.5px}

/* Shell */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;border-right:1px solid var(--line);background:#fffdf9;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand img{width:44px;height:44px;object-fit:contain}
.brand b{display:block;font-family:Fredoka;font-weight:600;font-size:16px;line-height:1.1}
.brand span{font-size:11.5px;color:var(--ink-3)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:6px 12px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;color:var(--ink-2);text-align:left;width:100%}
.nav-item:hover{background:var(--sand);color:var(--ink)}
.nav-item.on{background:var(--teal-50);color:var(--teal-700)}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--blush);color:var(--rose-700);border-radius:99px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 32px;background:rgba(255,249,242,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink-3)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--tiger);border:2px solid #fff}
.content{padding:28px 32px 120px;max-width:1240px;width:100%}

/* Primitives */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px} .pad-lg{padding:24px}
.row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column} .g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.grid{display:grid;gap:20px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.c21{grid-template-columns:2fr 1fr}.c12{grid-template-columns:1fr 2fr}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.page-head p{color:var(--ink-2);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--teal-700);color:#fff}
.btn.primary:hover{background:#346c62}
.btn.soft{background:var(--teal-50);color:var(--teal-700)}
.btn.ghost{background:var(--paper);border:1px solid var(--line-2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-teal{background:var(--teal-100);color:var(--teal-700)}
.p-mustard{background:var(--mustard-50);color:var(--mustard-700);box-shadow:inset 0 0 0 1px #f3dfb3}
.p-rose{background:var(--blush-50);color:var(--rose-700);box-shadow:inset 0 0 0 1px var(--blush)}
.p-grey{background:var(--sand);color:var(--ink-2)}
.p-sky{background:var(--sky-50);color:var(--sky-700)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{padding:10px 14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--teal-700)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fffcf7}
.num{text-align:right;font-variant-numeric:tabular-nums}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-family:Fredoka;font-size:13px}
.avatar svg{width:100%;height:100%}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:Fredoka;font-size:28px;line-height:1.1}
.kpi .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.bar{height:8px;background:var(--sand);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-2)}
.input{background:var(--paper);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
textarea.input{resize:none;min-height:84px}
.toggle{width:40px;height:24px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:.2s}
.toggle.on{background:var(--teal-700)} .toggle.on::after{left:19px}
.scene{display:block;width:100%;height:100%}
.ph{border-radius:14px;overflow:hidden;background:var(--sand)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--sky-50);color:var(--sky-700);font-size:13px}
.note.warn{background:var(--mustard-50);color:var(--mustard-700)}
.planned{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--mustard-50);color:var(--mustard-700);margin-left:auto}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.link{color:var(--teal-700);font-weight:700}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);min-height:190px;display:flex;align-items:center;padding:28px 32px}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero .copy{position:relative;max-width:560px}
.hero .copy p{color:var(--ink-2);margin-top:6px;font-size:15px}
.hero img.mascot{position:absolute;right:36px;bottom:-8px;width:150px}

/* Feed */
.post{overflow:hidden}
.post .media{aspect-ratio:4/3;position:relative}
.post .media .count{position:absolute;top:12px;right:12px;background:rgba(51,65,92,.7);color:#fff;font-size:12px;padding:3px 9px;border-radius:99px}
.dots{display:flex;gap:5px;justify-content:center;padding-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)} .dots i.on{background:var(--teal-700)}
.like{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.like.on{color:#d9534f} .like.on svg{fill:#d9534f;stroke:#d9534f}

/* Progress */
.seg{display:inline-flex;background:var(--sand);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:12.5px;color:var(--ink-2)}
.seg button.nya{background:var(--blush);color:var(--rose-700)}
.seg button.bl{background:var(--mustard);color:#5c3f08}
.seg button.ap{background:var(--teal);color:#16423a}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Sign-in */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{position:relative;overflow:hidden;background:var(--teal-50)}
.auth-art svg{position:absolute;inset:0;width:100%;height:100%}
.auth-art .quote{position:absolute;left:48px;bottom:48px;right:48px;color:var(--ink)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:48px}
.pin{display:flex;gap:12px;justify-content:center}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2)} .pin i.on{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.keypad button{height:72px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-family:Fredoka;font-size:24px}

/* Prototype switcher */
.proto{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;padding:6px;background:#2b3650;border-radius:99px;box-shadow:0 12px 32px -8px rgba(30,40,60,.45)}
.proto span{color:#a9b3c9;font-size:11.5px;padding:0 10px 0 12px;text-transform:uppercase;letter-spacing:.08em}
.proto button{color:#dfe5f1;padding:8px 14px;border-radius:99px;font-size:13px}
.proto button.on{background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

@media (max-width:1100px){.c4{grid-template-columns:repeat(2,1fr)}.c21,.c12,.c3{grid-template-columns:1fr}.hero img.mascot{display:none}}
@media (max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.auth{grid-template-columns:1fr}.auth-art{display:none}.c2{grid-template-columns:1fr}.top,.content{padding-left:16px;padding-right:16px}}
</style>
</head>

function radar(series, size = 300) {
  const n = 6, c = size/2, R = size*.34;
  const pt = (i, v) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [c + Math.cos(a)*R*v, c + Math.sin(a)*R*v]; };
  const poly = v => v.map((x,i) => pt(i,x).join(',')).join(' ');
  let g = [1/3, 2/3, 1].map(r => `<polygon points="${poly(Array(n).fill(r))}" fill="${r===1?'#fffaf3':'none'}" stroke="#eadfce"/>`).join('');
  g += DOMAINS.map((d,i) => { const [x,y] = pt(i,1); const [lx,ly] = pt(i,1.2); const anc = Math.abs(lx-c) < 8 ? 'middle' : lx > c ? 'start' : 'end';
    return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#eadfce"/><text x="${lx}" y="${ly+4}" text-anchor="${anc}" font-size="11.5" fill="#5d6882" font-weight="700">${d.split(/[ ,]/)[0]}</text>`; }).join('');
  g += series.map(s => `<polygon points="${poly(s.v)}" fill="${s.fill||'none'}" stroke="${s.c}" stroke-width="2.2" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round"/>` + (s.dots ? s.v.map((x,i)=>`<circle cx="${pt(i,x)[0]}" cy="${pt(i,x)[1]}" r="3.5" fill="#fff" stroke="${s.c}" stroke-width="2"/>`).join('') : '')).join('');
  return `<svg viewBox="-70 -6 ${size+140} ${size+12}" style="width:100%;max-width:420px;display:block;margin:auto" role="img" aria-label="Development across six domains">${g}</svg>`;
}
function bars(months, inc, exp) {
  const W = 640, H = 220, max = 300000, bw = 18, gap = W / months.length;
  let g = [0, 1e5, 2e5, 3e5].map(v => { const y = H - v/max*H; return `<line x1="40" x2="${W}" y1="${y}" y2="${y}" stroke="#f0e6d8"/><text x="32" y="${y+4}" text-anchor="end" font-size="11" fill="#8b93a7">${v ? (v/1e5)+'L' : '0'}</text>`; }).join('');
  months.forEach((m, i) => { const x = 40 + i*gap + gap/2;
    g += `<rect x="${x-bw-2}" y="${H-inc[i]/max*H}" width="${bw}" height="${inc[i]/max*H}" rx="5" fill="#7fb8ac"/><rect x="${x+2}" y="${H-exp[i]/max*H}" width="${bw}" height="${exp[i]/max*H}" rx="5" fill="#f4c87a"/><text x="${x}" y="${H+18}" text-anchor="middle" font-size="11.5" fill="#8b93a7">${m}</text>`; });
  return `<svg viewBox="0 -8 ${W} ${H+30}" style="width:100%" role="img" aria-label="Income and expenses by month">${g}</svg>`;
}

function catchUp(start, cp) { // exact days in each calendar month, Nu. 5,000/month, up to the day before the checkpoint
  let t = 0, d = new Date(start);
  while (d < cp) { const y = d.getFullYear(), m = d.getMonth(), dim = new Date(y, m + 1, 0).getDate(), next = new Date(y, m + 1, 1), end = cp < next ? cp : next;
    t += 5000 * Math.round((end - d) / 864e5) / dim; d = next; }
  return r2(t);
}
function feeSchedule() {
  const f = S.fp, plan = PLANS.find(p => p.k === f.plan), extra = Math.min(50, Math.max(0, +f.extra || 0));
  const start = f.mid ? new Date(2027, 2, 14) : new Date(2027, 1, 15), mid = new Date(2027, 5, 15);
  const tu = v => r2(v * (1 - extra / 100)), first = [], rows = [];
  let flag = '';
  first.push(['Admission fee', 1000]);
  first.push([`Stationery · ${start <= mid ? 'before' : 'after'} mid-term`, start <= mid ? 3000 : 1500]);
  [...f.uni].sort().forEach(i => first.push([`Uniform · ${UNIFORM[i][0]}`, 1500]));
  if (plan.k === 'm') first.push([`Tuition · ${monthOf(start)}`, tu(6000)]);
  else if (!f.mid) first.push([`Tuition · installment 1 of ${plan.n}`, tu(planAmt(plan))]);
  else if (plan.k === '1') { first.push(['Tuition · full year', tu(planAmt(plan))]); flag = 'open'; }
  else { const auto = catchUp(start, new Date(2027, 5, 30)); first.push([`Tuition · catch-up to 29 Jun`, tu(f.catch === '' ? auto : Math.max(0, +f.catch || 0)), f.catch === '' ? 'suggested' : 'adjusted']); }
  if (f.ext) first.push([`Extended time · ${monthOf(start)}`, 1000]);
  if (f.potty) first.push([`Potty training · ${monthOf(start)}`, 1000]);
  rows.push({date:start, title:'At enrolment · invoiced when you finalise', lines:first, now:true});
  if (plan.k === '2') rows.push({date:new Date(2027, 5, 30), title:'Installment 2 of 2', lines:[['Tuition', tu(planAmt(plan))]]});
  if (plan.k === '3') rows.push({date:new Date(2027, 5, 30), title:'Installment 2 of 3', lines:[['Tuition', tu(planAmt(plan))]]}, {date:new Date(2027, 8, 1), title:'Installment 3 of 3', lines:[['Tuition', tu(planAmt(plan))]]});
  const monthly = [], months = 11 - start.getMonth();
  if (plan.k === 'm') monthly.push(['Tuition', tu(6000)]);
  if (f.ext) monthly.push(['Extended time', 1000]);
  if (f.potty) monthly.push(['Potty training', 1000, 'until potty trained']);
  if (monthly.length) rows.push({date:new Date(2027, start.getMonth() + 1, 15), title:`Every month · ${months} invoices`, lines:monthly, months});
  rows.sort((a, b) => a.date - b.date);
  const total = r2(sum(rows.map(r => sum(r.lines.map(l => l[1])) * (r.months || 1))));
  return {rows, total, flag, start, extra};
}

  const nav = R.nav.map(([g, items]) => `<div class="nav-group">${g?`<div class="nav-label">${g}</div>`:''}${items.map(([k,l,i,c])=>`<button class="nav-item ${S.screen===k?'on':''}" data-go="${k}">${ic(i)}<span>${l}</span>${c==='p'?'<span class="planned">Phase 5</span>':c?`<span class="count">${c}</span>`:''}</button>`).join('')}</div>`).join('');
  const parentish = S.role === 'parent' || S.role === 'caregiver';
  app.innerHTML = `<div class="shell"><aside class="side"><div class="brand"><img src="${MASCOT}" alt=""><div><b>School of Heroes</b><span>Wangchuk's · ECCD Centre</span></div></div>${nav}
      <div class="side-foot">${initials(R.user[0])}<div class="stack" style="flex:1;min-width:0"><b class="small">${R.user[0]}</b><span class="small faint">${R.user[1]}</span></div><button class="faint" data-role="signin" title="Sign out">${ic('logout')}</button></div></aside>
    <main class="main"><div class="top">${parentish?childSwitch():`<div class="search">${ic('search')} Search children, families, invoices…</div>`}
      <div class="top-right"><span class="pill p-grey">2026 · Oct–Nov window</span><button class="icon-btn" data-go="${S.role==='owner'?'notifications':S.screen}">${ic('bell')}<span class="dot"></span></button>${initials(R.user[0],'var(--mustard)','var(--ink)')}</div></div>
      <div class="content">${(V[S.screen] || V[R.home])()}</div></main></div>${switcher}`;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-role],[data-tab],[data-chip],[data-like],[data-toast],[data-flip],[data-act]');
  if (!el) return;
  const d = el.dataset;
  if (d.act) { const msg = ACT[d.act](d.arg); if (msg) toast(msg); }
  else if (d.role) { S.role = d.role; S.screen = d.role === 'signin' ? 'login' : ROLES[d.role].home; S.tab = 0; S.chip = 0; scrollTo(0,0); }
  else if (d.go) { S.screen = d.go; S.tab = 0; S.chip = 0; scrollTo(0,0); }
  else if (d.tab) S.tab = +d.tab;
  else if (d.chip) S.chip = +d.chip;
  else if (d.like) { const i = +d.like; S.liked.has(i) ? S.liked.delete(i) : S.liked.add(i); }
  else if (d.flip !== undefined) { el.classList.toggle('on'); return; }
  else if (d.toast) { toast(d.toast); return; }
  render();
});
// Live edits: update only the preview so the field being typed in keeps focus
document.addEventListener('input', e => {
  const d = e.target.dataset, v = e.target.value;
  if (d.line) { const [i, f] = d.line.split(':'); S.inv.lines[+i][f] = f === 'amt' ? Math.max(0, +v || 0) : v; }
  else if (d.inv) { S.inv[d.inv] = d.inv === 'child' ? +v : v; if (d.inv === 'child') return render(); }
  else if (d.fp) { S.fp[d.fp] = v; const el = document.getElementById('fp-summary'); if (el) el.innerHTML = feeSummary(); return; }
  else return;
  const pv = document.getElementById('inv-preview'); if (pv) pv.innerHTML = invPreview();
  const t = document.getElementById('inv-total'); if (t) t.textContent = nu(sum(S.inv.lines.map(l => l.amt)));
});
document.addEventListener('change', e => { const d = e.target.dataset; if (d.disc) { S.discs[d.disc] = Math.min(50, Math.max(0, +e.target.value || 0)); render(); } });
render();
</script>
</body>
